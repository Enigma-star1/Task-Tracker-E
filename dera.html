<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DERA — Premium Output Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09060b; --surface: rgba(19, 13, 24, 0.75); --border: rgba(188, 163, 193, 0.15);
      --border-light: rgba(188, 163, 193, 0.3); --text: #F3EFF5; --muted: #A393A8;
      --cp: #FF6B35; --tratun: #2563EB; --studio: #A855F7; --pray: #10B981; --meet: #64748B;
      --accent-purple: #6d3576; --accent-gold: #9c6823; --accent-lavender: #bca3c1;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: 'IBM Plex Mono', monospace; min-height: 100vh; display: flex; flex-direction: column; }
    .header { padding: 32px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .brand-title { font-family: 'Barlow Condensed', sans-serif; font-size: 46px; font-weight: 800; letter-spacing: 8px; color: #fff; }
    .action-btn { font-family: 'IBM Plex Mono', monospace; font-size: 10px; text-transform: uppercase; color: var(--text); background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border-light); padding: 8px 14px; border-radius: 6px; cursor: pointer; }
    .grid-wrapper { flex: 1; overflow-x: auto; display: flex; flex-direction: column; }
    .week-grid { display: grid; grid-template-columns: repeat(7, minmax(180px, 1fr)); min-width: 1260px; height: 100%; }
    .day-col { border-right: 1px solid var(--border); background: var(--surface); padding: 20px; }
    .task-item { padding: 12px; border-radius: 6px; background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border); margin-bottom: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .delete-task-btn { color: var(--muted); font-weight: 800; cursor: pointer; padding: 0 5px; }
    .delete-task-btn:hover { color: #FF4444; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(7, 7, 15, 0.85); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: #14101A; border: 1px solid var(--border-light); padding: 28px; border-radius: 8px; width: 340px; display: flex; flex-direction: column; gap: 14px; }
    input, select { background: rgba(255,255,255,0.05); border: 1px solid var(--border); padding: 10px; color: #fff; }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <div class="brand-title">DERA TRACKER</div>
      <div style="font-size: 11px; color: var(--accent-lavender);">OUTPUT CORE</div>
    </div>
    <div style="display:flex; gap:10px;">
      <button class="action-btn" id="addTaskBtn">+ Task</button>
      <button class="action-btn" id="resetBtn">Reset</button>
    </div>
  </div>

  <div class="grid-wrapper"><div class="week-grid" id="weekGrid"></div></div>

  <div class="modal" id="taskModal">
    <div class="modal-content">
      <h3>INJECT CUSTOM TASK</h3>
      <select id="modDay"></select>
      <select id="modBrand">
        <option value="cp">CareerPaddy</option><option value="tratun">Tratun</option>
        <option value="studio">Enigma Studio</option><option value="pray">Praying Scripture</option><option value="meet">Meeting</option>
      </select>
      <select id="modRepeat">
        <option value="true">One-Time Task</option><option value="false">Recurring Task</option>
      </select>
      <input type="text" id="modText" placeholder="Task description">
      <input type="text" id="modTime" placeholder="Time (e.g. 4pm)">
      <div style="display:flex; gap:10px;"><button class="action-btn" id="modCancel" style="flex:1;">Cancel</button><button class="action-btn" id="modSave" style="flex:1; background:var(--accent-purple)">Save</button></div>
    </div>
  </div>

<script>
  const CUSTOM_TASKS_KEY = 'dera_custom_tasks_v6';
  let customTasks = JSON.parse(localStorage.getItem(CUSTOM_TASKS_KEY)) || [];
  const baseWeek = ['sat', 'sun', 'mon', 'tue', 'wed', 'thu', 'fri'];

  function renderGrid() {
    const grid = document.getElementById('weekGrid'); grid.innerHTML = '';
    baseWeek.forEach(day => {
      const col = document.createElement('div'); col.className = 'day-col';
      col.innerHTML = `<div style="font-size:20px; font-weight:800; margin-bottom:15px; color:var(--muted)">${day.toUpperCase()}</div><div id="tasks_${day}"></div>`;
      grid.appendChild(col);
      const container = document.getElementById(`tasks_${day}`);
      customTasks.filter(t => t.dayKey === day).forEach(task => {
        const item = document.createElement('div'); item.className = 'task-item';
        item.innerHTML = `<div>${task.text}</div><div class="delete-task-btn">×</div>`;
        item.querySelector('.delete-task-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          if (confirm('Delete this task permanently?')) {
            customTasks = customTasks.filter(t => t.id !== task.id);
            localStorage.setItem(CUSTOM_TASKS_KEY, JSON.stringify(customTasks));
            renderGrid();
          }
        });
        container.appendChild(item);
      });
    });
  }

  document.getElementById('addTaskBtn').addEventListener('click', () => {
    const dSelect = document.getElementById('modDay'); dSelect.innerHTML = '';
    baseWeek.forEach(d => dSelect.innerHTML += `<option value="${d}">${d.toUpperCase()}</option>`);
    document.getElementById('taskModal').style.display = 'flex';
  });

  document.getElementById('modSave').addEventListener('click', () => {
    customTasks.push({ 
      id: 'custom_' + Date.now(), dayKey: document.getElementById('modDay').value, 
      text: document.getElementById('modText').value, oneTime: document.getElementById('modRepeat').value === 'true'
    });
    localStorage.setItem(CUSTOM_TASKS_KEY, JSON.stringify(customTasks));
    document.getElementById('taskModal').style.display = 'none';
    renderGrid();
  });

  document.getElementById('modCancel').addEventListener('click', () => document.getElementById('taskModal').style.display = 'none');
  document.getElementById('resetBtn').addEventListener('click', () => { if(confirm('Reset all?')) { customTasks = []; localStorage.removeItem(CUSTOM_TASKS_KEY); renderGrid(); } });
  renderGrid();
</script>
</body>
</html>
