<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DERA // PRECISION</title>
  <style>
    :root {
      --bg: #0c0a0e;
      --glow: rgba(216, 180, 254, 0.15);
      --card: #1a1620;
      --text: #f8f7ff;
      --accent: #d8b4fe; /* The "Pretty" Glow */
      --danger: #f472b6;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; padding: 40px; }
    .header { margin-bottom: 40px; border-bottom: 1px solid var(--glow); padding-bottom: 20px; }
    .title { font-size: 32px; font-weight: 800; letter-spacing: 4px; color: var(--accent); }
    .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 15px; }
    .col { display: flex; flex-direction: column; gap: 10px; }
    .col-header { font-size: 12px; font-weight: 700; color: #666; margin-bottom: 5px; text-transform: uppercase; }
    .task { background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid var(--glow); cursor: pointer; transition: 0.3s; display: flex; justify-content: space-between; align-items: center; }
    .task:hover { border-color: var(--accent); box-shadow: 0 0 10px var(--glow); }
    .del { color: var(--danger); font-weight: 800; cursor: pointer; opacity: 0.6; }
    .del:hover { opacity: 1; }
    button { background: var(--accent); border: none; padding: 10px 20px; border-radius: 8px; color: var(--bg); font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">DERA // PRECISION</div>
    <button id="add">+ New Task</button>
  </div>
  <div class="grid" id="grid"></div>

<script>
  let tasks = JSON.parse(localStorage.getItem('dera_v35')) || [];
  const days = ['sat', 'sun', 'mon', 'tue', 'wed', 'thu', 'fri'];

  function render() {
    const grid = document.getElementById('grid'); grid.innerHTML = '';
    days.forEach(day => {
      const col = document.createElement('div'); col.className = 'col';
      col.innerHTML = `<div class="col-header">${day}</div>`;
      tasks.filter(t => t.day === day).forEach(t => {
        const div = document.createElement('div'); div.className = 'task';
        div.innerHTML = `<span>${t.text}</span><span class="del" onclick="del('${t.id}')">×</span>`;
        col.appendChild(div);
      });
      grid.appendChild(col);
    });
  }

  function del(id) { if(confirm('Delete this?')) { tasks = tasks.filter(t => t.id !== id); localStorage.setItem('dera_v35', JSON.stringify(tasks)); render(); } }
  
  document.getElementById('add').onclick = () => {
    const text = prompt("Task description:");
    const day = prompt("Day (sat, sun, mon...):").toLowerCase();
    if(text && day) { tasks.push({id: Date.now().toString(), text, day}); localStorage.setItem('dera_v35', JSON.stringify(tasks)); render(); }
  };
  render();
</script>
</body>
</html>
