<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DERA — Premium Output Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09060b;
      --surface: rgba(19, 13, 24, 0.75);
      --border: rgba(188, 163, 193, 0.15);
      --border-light: rgba(188, 163, 193, 0.3);
      --text: #F3EFF5;
      --muted: #A393A8;
      --accent-purple: #6d3576;
      --accent-gold: #9c6823;
      --accent-lavender: #bca3c1;
      --action-pink: #f472b6;
      --success-green: #10B981;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: radial-gradient(at 0% 0%, rgba(109, 53, 118, 0.4) 0px, transparent 50%),
                  radial-gradient(at 100% 100%, rgba(156, 104, 35, 0.25) 0px, transparent 50%),
                  radial-gradient(at 50% 100%, rgba(188, 163, 193, 0.15) 0px, transparent 70%),
                  var(--bg);
      background-attachment: fixed;
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    body.day-view .header { padding: 16px 20px; }
    body.day-view .brand-title { font-size: 32px; }
    body.day-view .metrics-bar { padding: 10px 20px; }
    body.day-view .week-grid.single-mode { margin: 15px auto; }

    .header {
      padding: 32px 32px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      backdrop-filter: blur(10px);
    }

    .brand-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 46px;
      font-weight: 800;
      letter-spacing: 8px;
      color: #fff;
      line-height: 1;
      text-shadow: 0 4px 12px rgba(0,0,0,0.5);
    }

    .brand-sub {
      font-size: 11px;
      color: var(--accent-lavender);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 8px;
      font-weight: 500;
    }

    .header-right { display: flex; align-items: center; gap: 28px; }
    .controls-wrapper { display: flex; align-items: center; gap: 12px; }

    .select-dropdown {
      background: rgba(19, 13, 24, 0.9);
      border: 1px solid var(--border-light);
      padding: 8px 14px;
      border-radius: 6px;
      color: #fff;
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
      outline: none;
      transition: all 0.2s;
    }

    .action-btn {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-light);
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .action-btn:hover, .action-btn.active-view-btn {
      background: var(--accent-purple);
      border-color: var(--accent-lavender);
    }

    .meta-time-block { display: flex; align-items: center; gap: 24px; }
    .clock-display { text-align: right; cursor: pointer; }

    .clock-time {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 44px;
      font-weight: 800;
      line-height: 1;
      color: var(--text);
      letter-spacing: 1px;
    }

    .clock-label { font-size: 9px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-top: 4px; }
    .today-block { text-align: right; }

    .today-count {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 44px;
      font-weight: 800;
      line-height: 1;
      color: var(--accent-gold);
    }

    .today-count-label { font-size: 9px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-top: 4px; }

    .metrics-bar {
      padding: 14px 32px;
      border-bottom: 1px solid var(--border);
      background: rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .streak-container { display: flex; align-items: center; gap: 16px; }
    .streak-label { font-size: 9px; color: var(--accent-lavender); letter-spacing: 2px; text-transform: uppercase; font-weight: 500; }
    .streak-dots { display: flex; gap: 12px; align-items: center; }
    .s-dot { display: flex; flex-direction: column; align-items: center; gap: 6px; }

    .s-circle {
      width: 12px; height: 12px;
      border-radius: 50%;
      background: var(--border-light);
      transition: all 0.3s ease;
    }

    .s-circle.done    { background: var(--success-green); box-shadow: 0 0 8px var(--success-green); }
    .s-circle.partial { background: var(--accent-purple);   box-shadow: 0 0 8px var(--accent-purple);   }
    .s-circle.skipped { background: rgba(255,255,255,0.1); opacity: 0.4; }
    .s-circle.is-today { background: transparent; border: 2px solid var(--accent-gold); box-shadow: 0 0 6px var(--accent-gold); }

    .s-day-label { font-size: 9px; color: var(--muted); font-weight: 600; }

    .progress-analytics { flex: 1; max-width: 400px; display: flex; align-items: center; gap: 12px; }
    .progress-bg { flex: 1; height: 6px; background: rgba(255,255,255,0.05); border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent-purple), var(--accent-gold)); transition: width 0.4s ease; }

    .day-tabs-row { display: none; padding: 10px 32px; background: rgba(0,0,0,0.1); border-bottom: 1px solid var(--border); gap: 8px; }

    .tab-btn { background: transparent; border: 1px solid transparent; color: var(--muted); font-family: inherit; font-size: 11px; padding: 6px 12px; border-radius: 4px; cursor: pointer; transition: all 0.15s; }
    .tab-btn.active { color: #fff; background: rgba(109, 53, 118, 0.3); border-color: var(--accent-purple); font-weight: 600; }

    .grid-wrapper { flex: 1; overflow-x: auto; display: flex; flex-direction: column; }

    .week-grid { display: grid; grid-template-columns: repeat(7, minmax(180px, 1fr)); min-width: 1260px; height: 100%; flex: 1; }
    .week-grid.single-mode { grid-template-columns: 1fr; min-width: 0; max-width: 600px; margin: 40px auto; width: 100%; padding: 0 20px; }

    .day-col { border-right: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; position: relative; }
    .day-col.skipped-state { opacity: 0.4; }
    .day-col:last-child { border-right: none; }
    .day-col.is-today { background: rgba(109, 53, 118, 0.12); }
    .day-col.is-today::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, var(--accent-purple), var(--accent-gold)); }
    .week-grid.single-mode .day-col { border: 1px solid var(--border); border-radius: 8px; }

    .day-head { padding: 20px 16px 14px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 2px; }
    .day-head-meta { display: flex; align-items: flex-end; justify-content: space-between; }
    .day-name { font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 800; letter-spacing: 2px; color: var(--muted); line-height: 1.1; }
    .day-date { font-family: 'Barlow Condensed', sans-serif; font-size: 16px; font-weight: 600; letter-spacing: 1px; color: var(--accent-lavender); text-transform: uppercase; }
    .day-controls { display: flex; align-items: center; gap: 8px; }
    .day-completion-badge { font-size: 11px; font-weight: 600; color: var(--accent-gold); }
    .skip-toggle-link { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; transition: color 0.15s; }
    .skip-toggle-link:hover { color: var(--action-pink); }
    .day-col.skipped-state .skip-toggle-link { color: var(--success-green); }
    .day-col.is-today .day-name { color: #fff; }
    .day-col.is-today .day-date { color: var(--accent-gold); }

    .day-tasks { padding: 14px 12px; display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 80px; }
    .empty-day-msg { display: flex; align-items: center; justify-content: center; flex: 1; font-size: 10px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; opacity: 0.5; min-height: 60px; }
    .skipped-msg { display: flex; align-items: center; justify-content: center; flex: 1; font-size: 10px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }

    .task-item { padding: 12px 14px; border-radius: 6px; background: rgba(255,255,255,0.02); border: 1px solid var(--border); cursor: pointer; transition: all 0.15s ease; user-select: none; }
    .task-item:hover { border-color: var(--border-light); background: rgba(255,255,255,0.04); }
    .task-item.done { opacity: 0.25; }
    .task-item.carry-forward-derived { border-style: dashed; border-color: rgba(109,53,118,0.5); background: rgba(109,53,118,0.02); }

    .task-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .task-left { display: flex; align-items: flex-start; gap: 10px; flex: 1; }

    .task-check { width: 15px; height: 15px; border: 1.5px solid var(--muted); border-radius: 4px; flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center; }
    .task-item.done .task-check { background: var(--accent-purple); border-color: var(--accent-lavender); }
    .chk-svg { opacity: 0; width: 9px; height: 7px; }
    .task-item.done .chk-svg { opacity: 1; }

    .task-content { flex: 1; }
    .task-text { font-size: 12px; line-height: 1.5; color: #fff; font-weight: 400; }
    .task-item.done .task-text { text-decoration: line-through; color: var(--muted); }

    .task-meta-row { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
    .task-time { font-size: 10px; color: var(--accent-lavender); }
    .task-badges { display: flex; gap: 6px; align-items: center; }

    .one-time-tag { display: inline-block; font-size: 8px; letter-spacing: 1px; text-transform: uppercase; color: var(--success-green); background: rgba(16,185,129,0.12); padding: 2px 6px; border-radius: 3px; }
    .carry-tag    { display: inline-block; font-size: 8px; letter-spacing: 1px; text-transform: uppercase; color: var(--accent-gold);   background: rgba(156,104,35,0.12);  padding: 2px 6px; border-radius: 3px; }

    .delete-task-btn { color: var(--muted); cursor: pointer; font-size: 14px; font-weight: 800; line-height: 1; padding: 0 4px; transition: color 0.15s; }
    .delete-task-btn:hover { color: var(--action-pink); }

    .task-notes-drawer { max-height: 0; overflow: hidden; transition: max-height 0.22s cubic-bezier(0.4,0,0.2,1); }
    .task-notes-drawer.open { max-height: 100px; }

    .task-notes-field { width: 100%; background: rgba(0,0,0,0.4); border: 1px solid var(--border); border-radius: 4px; color: var(--accent-lavender); font-family: inherit; font-size: 11px; padding: 6px 8px; margin-top: 8px; outline: none; resize: none; }
    .task-notes-field:focus { border-color: var(--accent-purple); }

    .summary-view-pane { display: none; max-width: 800px; width: 100%; margin: 40px auto; padding: 0 20px; flex-direction: column; gap: 24px; }
    .macro-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 24px; }
    .macro-title { font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; color: #fff; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    .brand-row-metric { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
    .brand-row-meta { display: flex; justify-content: space-between; font-size: 12px; text-transform: uppercase; }
    .brand-label-text { font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .brand-bar-track { width: 100%; height: 8px; background: rgba(255,255,255,0.05); border-radius: 4px; overflow: hidden; }
    .brand-bar-fill { height: 100%; width: 0%; transition: width 0.5s ease; border-radius: 4px; }

    .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(7,7,15,0.85); backdrop-filter: blur(8px); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: #14101A; border: 1px solid var(--border-light); padding: 28px; border-radius: 8px; width: 340px; display: flex; flex-direction: column; gap: 14px; }
    .modal-content h3 { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; }
    .modal-content input, .modal-content select { background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 5px; padding: 10px; color: #fff; font-family: inherit; font-size: 11px; outline: none; }
    .modal-content select option { background: #14101A; color: #fff; }

    .confirm-modal-text { font-size: 12px; color: var(--muted); line-height: 1.6; }
    .confirm-modal-actions { display: flex; gap: 10px; margin-top: 4px; }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <div class="brand-title">OUTPUT TRACKER</div>
      <div class="brand-sub" id="weekRangeDisplay">DERA</div>
    </div>
    <div class="header-right">
      <div class="controls-wrapper">
        <select class="select-dropdown" id="viewLayoutSwitch">
          <option value="week">Full Week View</option>
          <option value="day">Single Day View</option>
        </select>
        <select class="select-dropdown" id="meetingOffsetConfig">
          <option value="20">Meet Alert: 20m early</option>
          <option value="15">Meet Alert: 15m early</option>
          <option value="30">Meet Alert: 30m early</option>
        </select>
        <button class="action-btn" id="summaryViewToggleBtn">Summary</button>
        <button class="action-btn" id="addTaskBtn">+ Task</button>
      </div>
      <div class="meta-time-block">
        <div class="clock-display" id="clockTrigger">
          <div class="clock-time" id="liveClockDisplay">00:00:00</div>
          <div class="clock-label">Local Time</div>
        </div>
        <div class="today-block">
          <div class="today-count" id="todayCount">—</div>
          <div class="today-count-label">Today Done</div>
        </div>
      </div>
    </div>
  </div>

  <div class="metrics-bar">
    <div class="streak-container">
      <div class="streak-label">7-Day Rhythm</div>
      <div class="streak-dots" id="streakDots"></div>
    </div>
    <div class="progress-analytics">
      <div class="streak-label">Velocity</div>
      <div class="progress-bg"><div class="progress-fill" id="velocityFill"></div></div>
    </div>
  </div>

  <div class="day-tabs-row" id="dayTabsRow"></div>

  <div class="grid-wrapper">
    <div class="week-grid" id="weekGrid"></div>
    <div class="summary-view-pane" id="summaryViewPane">
      <div class="macro-card">
        <div class="macro-title">Weekly Metrics Diagnostic</div>
        <div id="brandMetricsAnchor"></div>
      </div>
    </div>
  </div>

  <div class="modal" id="taskModal">
    <div class="modal-content">
      <h3>INJECT CUSTOM TASK</h3>
      <select id="modDay"></select>
      <select id="modType">
        <option value="production">Production Task (Carries Forward)</option>
        <option value="time-anchored">Time-Anchored (Stays Behind)</option>
      </select>
      <select id="modRepeat">
        <option value="true">One-Time Task</option>
        <option value="false">Recurring Task</option>
      </select>
      <input type="text" id="modText" name="deraTaskDescription" autocomplete="off" placeholder="Task description">
      <input type="text" id="modTime" name="deraTaskTime" autocomplete="off" placeholder="Time (e.g. 4pm, 11am)">
      <div style="display:flex;gap:10px;margin-top:10px;">
        <button class="action-btn" id="modCancel" style="flex:1;">Cancel</button>
        <button class="action-btn" id="modSave" style="flex:1;background:var(--accent-purple)">Save</button>
      </div>
    </div>
  </div>

  <div class="modal" id="confirmModal">
    <div class="modal-content">
      <h3 id="confirmModalTitle">CONFIRM</h3>
      <div class="confirm-modal-text" id="confirmModalText"></div>
      <div class="confirm-modal-actions">
        <button class="action-btn" id="confirmModalCancel" style="flex:1;">Cancel</button>
        <button class="action-btn" id="confirmModalOk" style="flex:1;background:var(--action-pink);border-color:var(--action-pink);">Confirm</button>
      </div>
    </div>
  </div>

<script>
document.addEventListener('DOMContentLoaded', () => {

  const SUPABASE_URL = "https://gbewpiujdqnqswdbrigt.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdiZXdwaXVqZHFucXN3ZGJyaWd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2ODExMzAsImV4cCI6MjA5NjI1NzEzMH0.VdrJCmvGZzc-_GJF6m9drxdgsdeb5a1eb9AOIRxTWYQ";

  if (Notification.permission === 'default') Notification.requestPermission();

  let audioContextInstance = null;
  let audioUnlocked = false;

  function unlockAudio() {
    if (audioUnlocked) return;
    try {
      audioContextInstance = new (window.AudioContext || window.webkitAudioContext)();
      if (audioContextInstance.state === 'suspended') {
        audioContextInstance.resume();
      }
      audioUnlocked = true;
    } catch(e) { console.warn('AudioContext init failed:', e); }
  }

  document.addEventListener('click', unlockAudio, { once: true });
  document.addEventListener('keydown', unlockAudio, { once: true });
  document.addEventListener('touchstart', unlockAudio, { once: true });

  function showConfirm(title, message) {
    return new Promise((resolve) => {
      const modal  = document.getElementById('confirmModal');
      document.getElementById('confirmModalTitle').textContent = title;
      document.getElementById('confirmModalText').textContent  = message;
      modal.style.display = 'flex';
      const okBtn     = document.getElementById('confirmModalOk');
      const cancelBtn = document.getElementById('confirmModalCancel');
      function cleanup(result) {
        modal.style.display = 'none';
        okBtn.removeEventListener('click', onOk);
        cancelBtn.removeEventListener('click', onCancel);
        resolve(result);
      }
      function onOk()     { cleanup(true);  }
      function onCancel() { cleanup(false); }
      okBtn.addEventListener('click', onOk);
      cancelBtn.addEventListener('click', onCancel);
    });
  }

  function getTrackingWeek() {
    const sat = new Date('2026-06-06T12:00:00');
    const labels = ['SAT','SUN','MON','TUE','WED','THU','FRI'];
    const keys   = ['sat','sun','mon','tue','wed','thu','fri'];
    return keys.map((key, i) => {
      const d = new Date(sat); d.setDate(sat.getDate() + i);
      return { key, label: labels[i], date: `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}` };
    });
  }

  const baseWeekConfig = getTrackingWeek();

  const BASE_SCHEDULE_TEMPLATES = {
    sat: [
      { id:'sat_pray',   text:'Upload 6 videos — YT + Instagram', time:'11am',       oneTime:true,  taskType:'production' },
      { id:'sat_studio', text:'1 Photoshop design',                 time:'1pm',                       taskType:'production' }
    ],
    sun: [
      { id:'sun_blog',       text:'Write Blog post',                 time:'Night',                    taskType:'production' },
      { id:'sun_watermark',  text:'Create Watermarked Course video', time:'Night',                    taskType:'production' }
    ],
    mon: [
      { id:'mon_blog',     text:'Post Blog — Meta',               time:'9am',         taskType:'time-anchored' },
      { id:'mon_yt',       text:'Post Course — YouTube',          time:'12pm',        taskType:'time-anchored' },
      { id:'mon_wm',       text:'Post Watermarked video — Meta',  time:'12pm',        taskType:'time-anchored' },
      { id:'mon_meet',     text:'Core Alignment Meeting',         time:'6pm',         taskType:'time-anchored' },
      { id:'mon_tratun',   text:'Start design prep',              time:'10:30pm',     taskType:'production' }
    ],
    tue: [
      { id:'tue_debbie',   text:'Design thoughts → Operations',    time:'Before 12pm', taskType:'production' },
      { id:'tue_design',   text:'Finish design',                    time:'Before 12pm', taskType:'production' },
      { id:'tue_meet',     text:'Status Update Meeting',            time:'4pm',         taskType:'time-anchored' },
      { id:'tue_video',    text:'Create Highlight / Core Ally video', time:'10pm',        taskType:'production' }
    ],
    wed: [
      { id:'wed_post',     text:'Post Highlight / Core Ally video', time:'9am',     taskType:'time-anchored' },
      { id:'wed_create',   text:'Create Course video',            time:'12pm+',   taskType:'production' },
      { id:'wed_meet',     text:'Design Team Meeting',            time:'4pm',     taskType:'time-anchored' }
    ],
    thu: [
      { id:'thu_create',   text:'Create 3 Creative Media videos', time:'Anytime', taskType:'production' },
      { id:'thu_upload',   text:'Upload 2 videos — YT + Instagram', time:'Night',   taskType:'production' }
    ],
    fri: [
      { id:'fri_wm',       text:'Create + Post Watermarked Course — Meta', time:'Before 12pm', taskType:'production' },
      { id:'fri_reels',    text:'Create and Post Reels',                    time:'Before 12pm', taskType:'production' },
      { id:'fri_meet',     text:'Wrap-up Meeting',                          time:'6pm',         taskType:'time-anchored' }
    ]
  };

  const CUSTOM_TASKS_KEY   = 'dera_custom_tasks_v7';
  const TASK_NOTES_KEY     = 'dera_task_notes_v2';
  const MEETING_OFFSET_KEY = 'dera_meeting_offset_v2';

  function getToday() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  let state = {};
  let customTasks      = (() => { try { return JSON.parse(localStorage.getItem(CUSTOM_TASKS_KEY))   || []; } catch { return []; } })();
  let taskNotes        = (() => { try { return JSON.parse(localStorage.getItem(TASK_NOTES_KEY))     || {}; } catch { return {}; } })();
  let currentMeetingOffset = (() => { try { return parseInt(localStorage.getItem(MEETING_OFFSET_KEY), 10) || 20; } catch { return 20; } })();

  let currentLayoutView    = 'week';
  let activeDayTab         = 'sat';
  let alertedTasks         = {};
  let summaryLayoutVisible = false;

  document.getElementById('meetingOffsetConfig').value = currentMeetingOffset.toString();

  const detectedTodayStr = getToday();
  const foundTodayObj = baseWeekConfig.find(d => d.date === detectedTodayStr);
  if (foundTodayObj) activeDayTab = foundTodayObj.key;

  function saveCustomTasks(t) { localStorage.setItem(CUSTOM_TASKS_KEY, JSON.stringify(t)); }
  function saveTaskNotes()    { localStorage.setItem(TASK_NOTES_KEY,    JSON.stringify(taskNotes)); }

  async function fetchCloudState() {
    try {
      const res  = await fetch(`${SUPABASE_URL}/rest/v1/tracker_state?select=*`, {
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
      });
      const data = await res.json();
      state = {};
      if (Array.isArray(data)) {
        data.forEach(row => {
          if (row.counter_val !== null && row.counter_val !== undefined) {
            state[row.id] = Number(row.counter_val);
          } else {
            state[row.id] = Boolean(row.is_done);
          }
        });
      }
      
      if (state['cloud_serialized_dera_tasks_v6']) {
        try {
          const parsedCloud = JSON.parse(state['cloud_serialized_dera_tasks_v6']);
          if (Array.isArray(parsedCloud)) {
            customTasks = parsedCloud;
            saveCustomTasks(customTasks);
          }
        } catch(err) { console.error("Dera tasks string parse error", err); }
      }
    } catch(e) {
      console.error('Cloud pull error:', e);
    } finally {
      executeRenderCycles();
    }
  }

  async function syncToCloud(taskId, val) {
    const payload = {
      id:          taskId,
      is_done:     typeof val === 'boolean' ? val : false,
      counter_val: typeof val === 'number'  ? val : null,
      text_val:    typeof val === 'string'  ? val : null,
      updated_at:  new Date().toISOString()
    };
    try {
      await fetch(`${SUPABASE_URL}/rest/v1/tracker_state`, {
        method:  'POST',
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates' },
        body: JSON.stringify(payload)
      });
    } catch(e) { console.error('Cloud write error:', e); }
  }

  async function syncCustomTasksToCloud() {
    const serializedString = JSON.stringify(customTasks);
    await syncToCloud('cloud_serialized_dera_tasks_v6', serializedString);
  }

  function buildSchedule() {
    return baseWeekConfig.map(day => ({
      ...day,
      tasks: [...(BASE_SCHEDULE_TEMPLATES[day.key] || []), ...customTasks.filter(t => t.dayKey === day.key)]
    }));
  }

  function getComputedDayTasks(day, scheduleContext) {
    if (state[`skip_day_${day.key}`]) return [];
    const currentIdx = baseWeekConfig.findIndex(d => d.key === day.key);
    let combined = [...day.tasks];
    
    combined = combined.filter(t => !state[`deleted_template_${t.id}`]);

    for (let i = 0; i < currentIdx; i++) {
      const prior = scheduleContext[i];
      if (state[`skip_day_${prior.key}`]) continue;
      prior.tasks.forEach(t => {
        if (state[`deleted_template_${t.id}`]) return;
        if (t.taskType === 'production' && !state[t.id]) {
          if (!combined.some(ex => ex.id === t.id)) combined.push({ ...t, isCarriedForward: true });
        }
      });
    }
    return combined;
  }

  function playAlertChime() {
    if (!audioUnlocked || !audioContextInstance) return;
    try {
      const osc  = audioContextInstance.createOscillator();
      const gain = audioContextInstance.createGain();
      osc.connect(gain); gain.connect(audioContextInstance.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(587.33, audioContextInstance.currentTime);
      osc.frequency.setValueAtTime(880.00, audioContextInstance.currentTime + 0.15);
      gain.gain.setValueAtTime(0.3, audioContextInstance.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioContextInstance.currentTime + 0.4);
      osc.start(); osc.stop(audioContextInstance.currentTime + 0.4);
    } catch(e) { console.log(e); }
  }

  function parseTimeString(t) {
    if (!t) return null;
    let s = t.toLowerCase().replace(/\s+/g,'');
    const pm = s.includes('pm'), am = s.includes('am');
    if (!pm && !am) return null;
    s = s.replace('pm','').replace('am','');
    let h = 0, m = 0;
    if (s.includes(':')) { [h,m] = s.split(':').map(Number); } else { h = parseInt(s,10); }
    if (pm && h < 12) h += 12;
    if (am && h === 12) h = 0;
    return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  }

  function calculateMeetingAlarmTime(baseTimeStr, offsetMinutes) {
    const parsed = parseTimeString(baseTimeStr);
    if (!parsed) return null;
    let [h,m] = parsed.split(':').map(Number);
    let total = h*60 + m - offsetMinutes;
    if (total < 0) total += 1440;
    return `${String(Math.floor(total/60)).padStart(2,'0')}:${String(total%60).padStart(2,'0')}`;
  }

  function runBackgroundAlarmDaemon() {
    setInterval(() => {
      const now  = new Date();
      const h    = String(now.getHours()).padStart(2,'0');
      const m    = String(now.getMinutes()).padStart(2,'0');
      const s    = String(now.getSeconds()).padStart(2,'0');
      document.getElementById('liveClockDisplay').textContent = `${h}:${m}:${s}`;

      const todayStr = getToday();
      const curTime  = `${h}:${m}`;
      const fs       = buildSchedule();
      const todayDay = fs.find(d => d.date === todayStr);
      if (!todayDay || state[`skip_day_${todayDay.key}`]) return;

      getComputedDayTasks(todayDay, fs).forEach(task => {
        if (state[task.id]) return;
        let target, msg;
        if (task.id.includes('meet')) {
          target = calculateMeetingAlarmTime(task.time, currentMeetingOffset);
          msg = `MEETING IN ${currentMeetingOffset}m: ${task.text}`;
        } else {
          target = parseTimeString(task.time);
          msg = `[${task.time}] ${task.text}`;
        }
        if (!target || target !== curTime || alertedTasks[task.id]) return;
        alertedTasks[task.id] = true;
        playAlertChime();
        if (Notification.permission === 'granted') new Notification('DERA — Alert', { body: msg });
      });
    }, 1000);
  }

  function getDayMetrics(day, fullSchedule) {
    if (state[`skip_day_${day.key}`]) return { total:0, done:0, percentage:0, isSkipped:true };
    const tasks = getComputedDayTasks(day, fullSchedule);
    if (!tasks.length) return { total:0, done:0, percentage:0, isSkipped:false };
    let done = 0;
    tasks.forEach(t => {
      if (state[t.id]) done++;
    });
    return { total:tasks.length, done, percentage:Math.round((done/tasks.length)*100), isSkipped:false };
  }

  function dayCompletion(day, fullSchedule) {
    const m = getDayMetrics(day, fullSchedule);
    if (m.isSkipped)   return 'skipped';
    if (m.total === 0) return 'empty';
    return m.done === 0 ? 'empty' : (m.done === m.total ? 'done' : 'partial');
  }

  function calculateGlobalVelocity() {
    const fs = buildSchedule(); let total = 0, done = 0;
    fs.forEach(day => {
      if (state[`skip_day_${day.key}`]) return;
      getComputedDayTasks(day, fs).forEach(t => {
        total++;
        if (state[t.id]) done++;
      });
    });
    document.getElementById('velocityFill').style.width = `${total > 0 ? (done/total)*100 : 0}%`;
  }

  function renderStreak() {
    const el = document.getElementById('streakDots'); el.innerHTML = '';
    const today = getToday(); const fs = buildSchedule();
    fs.forEach(day => {
      const dot = document.createElement('div'); dot.className = 's-dot';
      const circle = document.createElement('div'); circle.className = 's-circle';
      const label  = document.createElement('div'); label.className = 's-day-label'; label.textContent = day.label;
      if (day.date === today) { circle.classList.add('is-today'); }
      else {
        const st = dayCompletion(day, fs);
        if (st === 'done')    circle.classList.add('done');
        if (st === 'partial') circle.classList.add('partial');
        if (st === 'skipped') circle.classList.add('skipped');
      }
      dot.appendChild(circle); dot.appendChild(label); el.appendChild(dot);
    });
  }

  function updateTodayCount() {
    const today = getToday(); const fs = buildSchedule();
    const dayData = fs.find(d => d.date === today);
    const el = document.getElementById('todayCount');
    if (!dayData) { el.textContent = '—'; return; }
    if (state[`skip_day_${dayData.key}`]) { el.textContent = 'SKIP'; return; }
    const m = getDayMetrics(dayData, fs);
    el.textContent = `${m.done}/${m.total}`;
  }

  function renderTabsRow() {
    const row = document.getElementById('dayTabsRow');
    if (currentLayoutView === 'week' || summaryLayoutVisible) { row.style.display = 'none'; return; }
    row.style.display = 'flex'; row.innerHTML = '';
    baseWeekConfig.forEach(d => {
      const btn = document.createElement('button');
      btn.className = 'tab-btn' + (activeDayTab === d.key ? ' active' : '');
      btn.textContent = `${d.label} (${new Date(d.date+'T12:00:00').getDate()})`;
      btn.addEventListener('click', () => { activeDayTab = d.key; renderTabsRow(); renderGrid(); });
      row.appendChild(btn);
    });
  }

  function executeSummaryRenderAnalytics() {
    const anchor = document.getElementById('brandMetricsAnchor'); anchor.innerHTML = '';
    const fs = buildSchedule();
    let totalNormalTasks = 0;
    let completedNormalTasks = 0;

    fs.forEach(day => {
      day.tasks.forEach(t => {
        if (state[`deleted_template_${t.id}`]) return;
        totalNormalTasks++;
        if (state[t.id]) completedNormalTasks++;
      });
    });

    const pct = totalNormalTasks > 0 ? Math.round((completedNormalTasks/totalNormalTasks)*100) : 0;
    const row = document.createElement('div'); row.className = 'brand-row-metric';
    row.innerHTML = `
      <div class="brand-row-meta">
        <div class="brand-label-text">
          <div style="width:7px;height:7px;border-radius:50%;background:var(--accent-purple);box-shadow:0 0 6px var(--accent-purple)"></div>
          Core Execution Vectors
        </div>
        <div style="color:var(--muted)">${completedNormalTasks}/${totalNormalTasks} (${pct}%)</div>
      </div>
      <div class="brand-bar-track"><div class="brand-bar-fill" style="width:${pct}%;background:var(--accent-purple)"></div></div>`;
    anchor.appendChild(row);
  }

  function renderGrid() {
    const grid        = document.getElementById('weekGrid');
    const summaryPane = document.getElementById('summaryViewPane');

    if (summaryLayoutVisible) {
      grid.style.display = 'none'; summaryPane.style.display = 'flex';
      executeSummaryRenderAnalytics(); return;
    }

    grid.style.display = 'grid'; summaryPane.style.display = 'none'; grid.innerHTML = '';

    const today        = getToday();
    const fullSchedule = buildSchedule();

    let displaySchedule = [...fullSchedule];

    if (currentLayoutView === 'day') {
      grid.className = 'week-grid single-mode';
      displaySchedule = displaySchedule.filter(d => d.key === activeDayTab);
      document.body.classList.add('day-view');
    } else {
      grid.className = 'week-grid';
      document.body.classList.remove('day-view');
    }

    if (fullSchedule.length > 0) {
      const f = new Date(fullSchedule[0].date+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
      const l = new Date(fullSchedule[6].date+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
      document.getElementById('weekRangeDisplay').innerHTML = `${f} – ${l} &nbsp;·&nbsp; DERA`;
    }

    displaySchedule.forEach(day => {
      const isSkipped = state[`skip_day_${day.key}`];
      const col = document.createElement('div');
      col.className = 'day-col' + (day.date === today ? ' is-today' : '') + (isSkipped ? ' skipped-state' : '');

      const head = document.createElement('div'); head.className = 'day-head';
      const headMeta = document.createElement('div'); headMeta.className = 'day-head-meta';
      const nameEl = document.createElement('div'); nameEl.className = 'day-name'; nameEl.textContent = day.label;

      const dayControls = document.createElement('div'); dayControls.className = 'day-controls';
      const metrics = getDayMetrics(day, fullSchedule);
      const completionEl = document.createElement('div'); completionEl.className = 'day-completion-badge';
      completionEl.textContent = isSkipped ? 'SKIPPED' : (metrics.total > 0 ? `${metrics.percentage}%` : '0%');

      const skipLink = document.createElement('a'); skipLink.className = 'skip-toggle-link';
      skipLink.textContent = isSkipped ? '[Track]' : '[Skip]';
      skipLink.addEventListener('click', async (e) => {
        e.stopPropagation();
        const k = `skip_day_${day.key}`; state[k] = !state[k];
        await syncToCloud(k, state[k]); executeRenderCycles();
      });

      dayControls.appendChild(completionEl); dayControls.appendChild(skipLink);
      headMeta.appendChild(nameEl); headMeta.appendChild(dayControls);

      const dateEl = document.createElement('div'); dateEl.className = 'day-date';
      dateEl.textContent = new Date(day.date+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'2-digit'});

      head.appendChild(headMeta); head.appendChild(dateEl); col.appendChild(head);

      const tasksEl = document.createElement('div'); tasksEl.className = 'day-tasks';

      if (isSkipped) {
        const msg = document.createElement('div'); msg.className = 'skipped-msg'; msg.textContent = 'Day Allocation Skipped';
        tasksEl.appendChild(msg);
      } else {
        const computedTasks = getComputedDayTasks(day, fullSchedule);

        if (computedTasks.length === 0) {
          const emptyMsg = document.createElement('div');
          emptyMsg.className = 'empty-day-msg';
          emptyMsg.textContent = 'No tasks scheduled';
          tasksEl.appendChild(emptyMsg);
        } else {
          computedTasks.forEach(task => {

            const item = document.createElement('div');
            item.className = `task-item${state[task.id] ? ' done' : ''}${task.isCarriedForward ? ' carry-forward-derived' : ''}`;

            const row     = document.createElement('div'); row.className = 'task-row';
            const taskLeft = document.createElement('div'); taskLeft.className = 'task-left';
            const check   = document.createElement('div'); check.className = 'task-check';
            check.innerHTML = `<svg class="chk-svg" viewBox="0 0 8 6" fill="none"><path d="M1 3L3 5L7 1" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
            const content = document.createElement('div'); content.className = 'task-content';
            const text    = document.createElement('div'); text.className = 'task-text'; text.textContent = task.text;

            const metaRow = document.createElement('div'); metaRow.className = 'task-meta-row';
            const time    = document.createElement('div'); time.className = 'task-time'; time.textContent = task.time;
            metaRow.appendChild(time);

            const badges = document.createElement('div'); badges.className = 'task-badges';
            if (task.isCarriedForward) { const t = document.createElement('div'); t.className = 'carry-tag'; t.textContent = 'Carry'; badges.appendChild(t); }
            if (task.oneTime === true) { const t = document.createElement('div'); t.className = 'one-time-tag'; t.textContent = 'One-time'; badges.appendChild(t); }
            metaRow.appendChild(badges);
            content.appendChild(text); content.appendChild(metaRow);

            const drawer     = document.createElement('div'); drawer.className = 'task-notes-drawer';
            const notesInput = document.createElement('textarea'); notesInput.className = 'task-notes-field';
            notesInput.placeholder = 'Add contextual logging notes...'; notesInput.value = taskNotes[task.id] || '';
            notesInput.addEventListener('click', (e) => e.stopPropagation());
            notesInput.addEventListener('input', (e) => { taskNotes[task.id] = e.target.value; saveTaskNotes(); });
            drawer.appendChild(notesInput); content.appendChild(drawer);

            taskLeft.appendChild(check); taskLeft.appendChild(content);
            row.appendChild(taskLeft);

            const delBtn = document.createElement('div');
            delBtn.className = 'delete-task-btn';
            delBtn.textContent = '×';
            delBtn.addEventListener('click', async (e) => {
              e.stopPropagation();
              const confirmed = await showConfirm('DELETE TASK', 'Permanently delete this task? This cannot be undone.');
              if (confirmed) {
                customTasks = customTasks.filter(t => t.id !== task.id);
                saveCustomTasks(customTasks);
                state[`deleted_template_${task.id}`] = true;
                await syncCustomTasksToCloud();
                await syncToCloud(`deleted_template_${task.id}`, true);
                executeRenderCycles();
              }
            });
            row.appendChild(delBtn);

            item.appendChild(row);

            item.addEventListener('click', async (e) => {
              if (e.target === notesInput || e.target.classList.contains('delete-task-btn')) return;
              if (e.target.closest('.task-check') || state[task.id]) {
                state[task.id] = !state[task.id]; await syncToCloud(task.id, state[task.id]); executeRenderCycles();
              } else {
                document.querySelectorAll('.task-notes-drawer').forEach(d => { if (d !== drawer) d.classList.remove('open'); });
                drawer.classList.toggle('open');
              }
            });
            tasksEl.appendChild(item);
          });
        }
      }
      col.appendChild(tasksEl); grid.appendChild(col);
    });
  }

  function executeRenderCycles() { renderGrid(); renderTabsRow(); renderStreak(); updateTodayCount(); calculateGlobalVelocity(); }

  document.getElementById('viewLayoutSwitch').addEventListener('change', (e) => {
    summaryLayoutVisible = false;
    document.getElementById('summaryViewToggleBtn').classList.remove('active-view-btn');
    currentLayoutView = e.target.value; executeRenderCycles();
  });

  document.getElementById('meetingOffsetConfig').addEventListener('change', (e) => {
    currentMeetingOffset = parseInt(e.target.value, 10);
    localStorage.setItem(MEETING_OFFSET_KEY, currentMeetingOffset.toString());
    alertedTasks = {};
  });

  document.getElementById('summaryViewToggleBtn').addEventListener('click', (e) => {
    summaryLayoutVisible = !summaryLayoutVisible;
    e.target.classList.toggle('active-view-btn', summaryLayoutVisible); executeRenderCycles();
  });

  const modal = document.getElementById('taskModal');
  document.getElementById('addTaskBtn').addEventListener('click', () => {
    const daySelect = document.getElementById('modDay'); daySelect.innerHTML = '';
    baseWeekConfig.forEach(d => { daySelect.innerHTML += `<option value="${d.key}">${d.label}</option>`; });
    daySelect.value = activeDayTab;
    modal.style.display = 'flex';
  });
  document.getElementById('modCancel').addEventListener('click', () => modal.style.display = 'none');
  document.getElementById('modSave').addEventListener('click', async () => {
    const txt = document.getElementById('modText').value.trim();
    if (!txt) { await showConfirm('MISSING INPUT', 'Task description cannot be empty.'); return; }
    customTasks.push({
      id: 'custom_' + Date.now(),
      dayKey: document.getElementById('modDay').value,
      text:   txt,
      time:   document.getElementById('modTime').value.trim() || 'Anytime',
      oneTime: document.getElementById('modRepeat').value === 'true',
      taskType: document.getElementById('modType').value
    });
    saveCustomTasks(customTasks); modal.style.display = 'none';
    document.getElementById('modText').value = ''; document.getElementById('modTime').value = '';
    await syncCustomTasksToCloud();
    executeRenderCycles();
  });

  function bootTrackerEngine() {
    const modeParam = new URLSearchParams(window.location.search).get('view');
    if (modeParam === 'day') { currentLayoutView = 'day'; document.getElementById('viewLayoutSwitch').value = 'day'; }
    runBackgroundAlarmDaemon();
    fetchCloudState();
  }

  bootTrackerEngine();
});
</script>
</body>
