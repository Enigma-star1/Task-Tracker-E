<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ENIGMA — Premium Output Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09060b;
      --surface: rgba(19, 13, 24, 0.75);
      --border: rgba(188, 163, 193, 0.15);
      --border-light: rgba(188, 163, 193, 0.3);
      --text: #F3EFF5;
      --muted: #A393A8;
      --cp: #FF6B35;
      --tratun: #2563EB;
      --studio: #A855F7;
      --pray: #10B981;
      --meet: #64748B;
      --accent-purple: #6d3576;
      --accent-gold: #9c6823;
      --accent-lavender: #bca3c1;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: radial-gradient(at 0% 0%, rgba(109, 53, 118, 0.4) 0px, transparent 50%),
                  radial-gradient(at 100% 100%, rgba(156, 104, 35, 0.25) 0px, transparent 50%),
                  radial-gradient(at 50% 100%, rgba(188, 163, 193, 0.15) 0px, transparent 70%),
                  var(--bg);
      background-attachment: fixed;
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* FIX 4: Replaced dead :has([value]) CSS with a data-attribute class system */
    body.day-view .header { padding: 16px 20px; }
    body.day-view .brand-title { font-size: 32px; }
    body.day-view .metrics-bar { padding: 10px 20px; }
    body.day-view .week-grid.single-mode { margin: 15px auto; }

    .header {
      padding: 32px 32px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      backdrop-filter: blur(10px);
    }

    .brand-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 46px;
      font-weight: 800;
      letter-spacing: 8px;
      color: #fff;
      line-height: 1;
      text-shadow: 0 4px 12px rgba(0,0,0,0.5);
    }

    .brand-sub {
      font-size: 11px;
      color: var(--accent-lavender);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 8px;
      font-weight: 500;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .controls-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .select-dropdown {
      background: rgba(19, 13, 24, 0.9);
      border: 1px solid var(--border-light);
      padding: 8px 14px;
      border-radius: 6px;
      color: #fff;
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
      outline: none;
      transition: all 0.2s;
    }

    .action-btn {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-light);
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .action-btn:hover, .action-btn.active-view-btn {
      background: var(--accent-purple);
      border-color: var(--accent-lavender);
    }

    .meta-time-block {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .clock-display { text-align: right; }

    .clock-time {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 44px;
      font-weight: 800;
      line-height: 1;
      color: var(--text);
      letter-spacing: 1px;
    }

    .clock-label {
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .today-block { text-align: right; }

    .today-count {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 44px;
      font-weight: 800;
      line-height: 1;
      color: var(--accent-gold);
    }

    .today-count-label {
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .metrics-bar {
      padding: 14px 32px;
      border-bottom: 1px solid var(--border);
      background: rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .streak-container {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .streak-label {
      font-size: 9px;
      color: var(--accent-lavender);
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 500;
    }

    .streak-dots { display: flex; gap: 12px; align-items: center; }

    .s-dot { display: flex; flex-direction: column; align-items: center; gap: 6px; }

    .s-circle {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--border-light);
      transition: all 0.3s ease;
    }

    .s-circle.done    { background: var(--pray); box-shadow: 0 0 8px var(--pray); }
    .s-circle.partial { background: var(--cp); box-shadow: 0 0 8px var(--cp); }
    .s-circle.skipped { background: var(--meet); opacity: 0.4; }
    .s-circle.is-today {
      background: transparent;
      border: 2px solid var(--accent-gold);
      box-shadow: 0 0 6px var(--accent-gold);
    }

    .s-day-label { font-size: 9px; color: var(--muted); font-weight: 600; }

    .progress-analytics {
      flex: 1;
      max-width: 400px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .progress-bg {
      flex: 1;
      height: 6px;
      background: rgba(255,255,255,0.05);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-purple), var(--accent-gold));
      transition: width 0.4s ease;
    }

    .day-tabs-row {
      display: none;
      padding: 10px 32px;
      background: rgba(0,0,0,0.1);
      border-bottom: 1px solid var(--border);
      gap: 8px;
    }

    .tab-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 11px;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .tab-btn.active {
      color: #fff;
      background: rgba(109, 53, 118, 0.3);
      border-color: var(--accent-purple);
      font-weight: 600;
    }

    .grid-wrapper {
      flex: 1;
      overflow-x: auto;
      display: flex;
      flex-direction: column;
    }

    .week-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(180px, 1fr));
      min-width: 1260px;
      height: 100%;
      flex: 1;
    }

    .week-grid.single-mode {
      grid-template-columns: 1fr;
      min-width: 0;
      max-width: 600px;
      margin: 40px auto;
      width: 100%;
      padding: 0 20px;
    }

    .day-col {
      border-right: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .day-col.skipped-state { opacity: 0.4; }
    .day-col:last-child { border-right: none; }
    .day-col.is-today { background: rgba(109, 53, 118, 0.12); }

    .day-col.is-today::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--accent-purple), var(--accent-gold));
    }

    .week-grid.single-mode .day-col {
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .day-head {
      padding: 20px 16px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .day-head-meta {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
    }

    .day-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--muted);
      line-height: 1.1;
    }

    .day-date {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 1px;
      color: var(--accent-lavender);
      text-transform: uppercase;
    }

    .day-controls { display: flex; align-items: center; gap: 8px; }

    .day-completion-badge { font-size: 11px; font-weight: 600; color: var(--accent-gold); }

    .skip-toggle-link {
      font-size: 9px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: color 0.15s;
    }

    .skip-toggle-link:hover { color: var(--cp); }
    .day-col.skipped-state .skip-toggle-link { color: var(--pray); }
    .day-col.is-today .day-name { color: #fff; }
    .day-col.is-today .day-date { color: var(--accent-gold); }

    .day-tasks {
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .skipped-msg {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--muted);
      text-transform: uppercase;
    }

    .task-item {
      padding: 12px 14px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
    }

    .task-item:hover {
      border-color: var(--border-light);
      background: rgba(255, 255, 255, 0.04);
    }

    .task-item.done { opacity: 0.25; }

    .task-item.carry-forward-derived {
      border-style: dashed;
      border-color: rgba(255, 107, 53, 0.4);
      background: rgba(255, 107, 53, 0.02);
    }

    .task-row { display: flex; align-items: flex-start; gap: 10px; }

    .brand-pip {
      width: 7px; height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 5px;
    }

    .brand-cp    .brand-pip { background: var(--cp); box-shadow: 0 0 6px var(--cp); }
    .brand-tratun .brand-pip { background: var(--tratun); box-shadow: 0 0 6px var(--tratun); }
    .brand-studio .brand-pip { background: var(--studio); box-shadow: 0 0 6px var(--studio); }
    .brand-pray   .brand-pip { background: var(--pray); box-shadow: 0 0 6px var(--pray); }
    .brand-meet   .brand-pip { background: var(--meet); box-shadow: 0 0 6px var(--meet); }

    .task-check {
      width: 15px; height: 15px;
      border: 1.5px solid var(--muted);
      border-radius: 4px;
      flex-shrink: 0;
      margin-top: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .task-item.done .task-check {
      background: var(--accent-purple);
      border-color: var(--accent-lavender);
    }

    .chk-svg { opacity: 0; width: 9px; height: 7px; }
    .task-item.done .chk-svg { opacity: 1; }

    .task-content { flex: 1; }

    .task-text { font-size: 12px; line-height: 1.5; color: #fff; font-weight: 400; }
    .task-item.done .task-text { text-decoration: line-through; color: var(--muted); }

    .task-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 4px;
    }

    .task-time { font-size: 10px; color: var(--accent-lavender); }

    .task-badges { display: flex; gap: 6px; align-items: center; }

    .one-time-tag {
      display: inline-block;
      font-size: 8px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--pray);
      background: rgba(16, 185, 129, 0.12);
      padding: 2px 6px;
      border-radius: 3px;
    }

    .carry-tag {
      display: inline-block;
      font-size: 8px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--cp);
      background: rgba(255, 107, 53, 0.12);
      padding: 2px 6px;
      border-radius: 3px;
    }

    .task-notes-drawer {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.22s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .task-notes-drawer.open { max-height: 100px; }

    .task-notes-field {
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--accent-lavender);
      font-family: inherit;
      font-size: 11px;
      padding: 6px 8px;
      margin-top: 8px;
      outline: none;
      resize: none;
    }

    .task-notes-field:focus { border-color: var(--accent-purple); }

    .counter-widget {
      border: 1px solid var(--border-light);
      border-radius: 6px;
      padding: 10px 12px;
      background: rgba(109, 53, 118, 0.05);
    }

    .counter-head {
      font-size: 10px;
      color: var(--text);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .counter-head span { color: var(--accent-gold); font-weight: 600; }
    .counter-time { font-size: 9px; color: var(--muted); margin-bottom: 8px; }
    .counter-btns { display: flex; gap: 6px; }

    .c-btn {
      flex: 1;
      height: 28px;
      border: 1.5px solid var(--border-light);
      background: transparent;
      color: var(--muted);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 16px;
      font-weight: 700;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.12s;
    }

    .c-btn:hover { border-color: var(--accent-lavender); color: var(--text); }
    .c-btn.active { background: var(--accent-purple); border-color: var(--accent-lavender); color: #fff; }

    .summary-view-pane {
      display: none;
      max-width: 800px;
      width: 100%;
      margin: 40px auto;
      padding: 0 20px;
      flex-direction: column;
      gap: 24px;
    }

    .macro-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
    }

    .macro-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #fff;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    .brand-row-metric { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }

    .brand-row-meta { display: flex; justify-content: space-between; font-size: 12px; text-transform: uppercase; }

    .brand-label-text { font-weight: 600; display: flex; align-items: center; gap: 8px; }

    .brand-bar-track {
      width: 100%;
      height: 8px;
      background: rgba(255,255,255,0.05);
      border-radius: 4px;
      overflow: hidden;
    }

    .brand-bar-fill {
      height: 100%;
      width: 0%;
      transition: width 0.5s ease;
      border-radius: 4px;
    }

    .reupload-running-block {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 107, 53, 0.05);
      border: 1px dashed var(--cp);
      padding: 16px;
      border-radius: 6px;
    }

    .reupload-running-title { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--text); }
    .reupload-running-count { font-family: 'Barlow Condensed', sans-serif; font-size: 36px; font-weight: 800; color: var(--cp); }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(7, 7, 15, 0.85);
      backdrop-filter: blur(8px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: #14101A;
      border: 1px solid var(--border-light);
      padding: 28px;
      border-radius: 8px;
      width: 340px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal-content h3 { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; }

    .modal-content input,
    .modal-content select {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 10px;
      color: #fff;
      font-family: inherit;
      font-size: 11px;
      outline: none;
    }

    .modal-content select option { background: #14101A; color: #fff; }

    .footer-legend {
      padding: 16px 32px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      background: rgba(0,0,0,0.2);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 10px;
      color: var(--accent-lavender);
      text-transform: uppercase;
    }

    .l-dot { width: 8px; height: 8px; border-radius: 50%; }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <div class="brand-title">OUTPUT TRACKER</div>
      <div class="brand-sub" id="weekRangeDisplay">ENIGMA</div>
    </div>
    <div class="header-right">
      <div class="controls-wrapper">
        <select class="select-dropdown" id="viewLayoutSwitch">
          <option value="week">Full Week View</option>
          <option value="day">Single Day View</option>
        </select>
        <select class="select-dropdown" id="brandFilter">
          <option value="all">All Brands</option>
          <option value="cp">CareerPaddy</option>
          <option value="tratun">Tratun</option>
          <option value="studio">Enigma Studio</option>
          <option value="pray">Praying Scripture</option>
          <option value="meet">Meetings</option>
        </select>
        <select class="select-dropdown" id="meetingOffsetConfig">
          <option value="20">Meet Alert: 20m early</option>
          <option value="15">Meet Alert: 15m early</option>
          <option value="30">Meet Alert: 30m early</option>
        </select>
        <button class="action-btn" id="summaryViewToggleBtn">Summary</button>
        <button class="action-btn" id="addTaskBtn">+ Task</button>
        <button class="action-btn" id="resetBtn">Reset</button>
      </div>
      <div class="meta-time-block">
        <div class="clock-display">
          <div class="clock-time" id="liveClockDisplay">00:00:00</div>
          <div class="clock-label">Local Time</div>
        </div>
        <div class="today-block">
          <div class="today-count" id="todayCount">—</div>
          <div class="today-count-label">Today Done</div>
        </div>
      </div>
    </div>
  </div>

  <div class="metrics-bar">
    <div class="streak-container">
      <div class="streak-label">7-Day Rhythm</div>
      <div class="streak-dots" id="streakDots"></div>
    </div>
    <div class="progress-analytics">
      <div class="streak-label">Velocity</div>
      <div class="progress-bg"><div class="progress-fill" id="velocityFill"></div></div>
    </div>
  </div>

  <div class="day-tabs-row" id="dayTabsRow"></div>

  <div class="grid-wrapper">
    <div class="week-grid" id="weekGrid"></div>
    <div class="summary-view-pane" id="summaryViewPane">
      <div class="macro-card">
        <div class="macro-title">Brand Track Diagnostics</div>
        <div id="brandMetricsAnchor"></div>
      </div>
      <div class="reupload-running-block">
        <div class="reupload-running-title">Weekly Cumulative Reuploads</div>
        <div class="reupload-running-count" id="reuploadRunningCount">0</div>
      </div>
    </div>
  </div>

  <div class="footer-legend">
    <div class="legend-item"><div class="l-dot" style="background:var(--cp)"></div>CareerPaddy</div>
    <div class="legend-item"><div class="l-dot" style="background:var(--tratun)"></div>Tratun</div>
    <div class="legend-item"><div class="l-dot" style="background:var(--studio)"></div>Enigma Studio</div>
    <div class="legend-item"><div class="l-dot" style="background:var(--pray)"></div>Praying Scripture</div>
    <div class="legend-item"><div class="l-dot" style="background:var(--meet)"></div>Meeting</div>
  </div>

  <div class="modal" id="taskModal">
    <div class="modal-content">
      <h3>INJECT CUSTOM TASK</h3>
      <select id="modDay"></select>
      <select id="modBrand">
        <option value="cp">CareerPaddy</option>
        <option value="tratun">Tratun</option>
        <option value="studio">Enigma Studio</option>
        <option value="pray">Praying Scripture</option>
        <option value="meet">Meeting</option>
      </select>
      <select id="modType">
        <option value="production">Production Task (Carries Forward)</option>
        <option value="time-anchored">Time-Anchored (Stays Behind)</option>
      </select>
      <input type="text" id="modText" placeholder="Task description">
      <input type="text" id="modTime" placeholder="Time (e.g. 4pm, 11am)">
      <div style="display:flex; gap:10px; margin-top:10px;">
        <button class="action-btn" id="modCancel" style="flex:1;">Cancel</button>
        <button class="action-btn" id="modSave" style="flex:1; background:var(--accent-purple)">Save</button>
      </div>
    </div>
  </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const SUPABASE_URL = "https://gbewpiujdqnqswdbrigt.supabase.co";
  const SUPABASE_KEY = "sb_publishable_wI8epgUrgKSI9CTg9ytHNA_dzrkqeko";

  if (Notification.permission === 'default') Notification.requestPermission();

  function getTrackingWeek() {
    const sat = new Date('2026-06-06T12:00:00');
    const labels = ['SAT','SUN','MON','TUE','WED','THU','FRI'];
    const keys   = ['sat','sun','mon','tue','wed','thu','fri'];
    return keys.map((key, i) => {
      const d = new Date(sat);
      d.setDate(sat.getDate() + i);

  // ── SUPABASE SYNC ──────────────────────────────────────────────────────────
  async function fetchCloudState() {
    try {
      const res  = await fetch(`${SUPABASE_URL}/rest/v1/tracker_state?select=*`, {
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
      });
      const data = await res.json();
      state = {};
      data.forEach(row => {
        // FIX 3: Separate counter and boolean state cleanly.
        // counter_val column drives counter tasks; is_done drives checkbox tasks.
        // A counter row with value 0 must remain 0, not fall through to boolean.
        if (row.counter_val !== null && row.counter_val !== undefined) {
          state[row.id] = Number(row.counter_val); // always numeric for counter rows
        } else {
          state[row.id] = Boolean(row.is_done);
        }
      });
      executeRenderCycles();
    } catch(e) { console.error('Cloud pull error:', e); }
  }

  async function syncToCloud(taskId, val) {
    const payload = {
      id:          taskId,
      is_done:     typeof val === 'boolean' ? val : false,
      counter_val: typeof val === 'number'  ? val : null,
      updated_at:  new Date().toISOString()
    };
    try {
      await fetch(`${SUPABASE_URL}/rest/v1/tracker_state`, {
        method:  'POST',
        headers: {
          'apikey':        SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`,
          'Content-Type':  'application/json',
          'Prefer':        'resolution=merge-duplicates'
        },
        body: JSON.stringify(payload)
      });
    } catch(e) { console.error('Cloud write error:', e); }
  }

  // FIX 2: PostgREST requires a WHERE filter for DELETE — use updated_at not null
  async function clearCloudState() {

  // ── SCHEDULE ──────────────────────────────────────────────────────────────
  function buildSchedule() {
    return baseWeekConfig.map(day => ({
      ...day,
      tasks: [...(BASE_SCHEDULE_TEMPLATES[day.key] || []), ...customTasks.filter(t => t.dayKey === day.key)]
    }));
  }

  function getComputedDayTasks(day, scheduleContext) {
    if (state[`skip_day_${day.key}`]) return [];
    const currentIdx = baseWeekConfig.findIndex(d => d.key === day.key);
    let dayTasksCombined = [...day.tasks];
    for (let i = 0; i < currentIdx; i++) {
      const priorDay = scheduleContext[i];
      if (state[`skip_day_${priorDay.key}`]) continue;
      priorDay.tasks.forEach(t => {
        if (t.taskType === 'production' && !t.isCounter && !state[t.id]) {
          if (!dayTasksCombined.some(ex => ex.id === t.id)) {
            dayTasksCombined.push({ ...t, isCarriedForward: true });
          }
        }
      });
    }
    return dayTasksCombined;
  }

  // ── ALARM ENGINE ──────────────────────────────────────────────────────────
  function playAlertChime() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(587.33, ctx.currentTime);
      osc.frequency.setValueAtTime(880.00, ctx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
      osc.start(); osc.stop(ctx.currentTime + 0.4);
    } catch(e) { console.log(e); }
  }

  function parseTimeString(timeStr) {
    if (!timeStr) return null;
    let clean = timeStr.toLowerCase().replace(/\s+/g, '');
    const isPm = clean.includes('pm'), isAm = clean.includes('am');
    if (!isPm && !isAm) return null;
    clean = clean.replace('pm','').replace('am','');
    let hrs = 0, mins = 0;
    if (clean.includes(':')) { [hrs, mins] = clean.split(':').map(Number); }
    else { hrs = parseInt(clean, 10); }
    if (isPm && hrs < 12) hrs += 12;
    if (isAm && hrs === 12) hrs = 0;
    return `${String(hrs).padStart(2,'0')}:${String(mins).padStart(2,'0')}`;
  }

  function calculateMeetingAlarmTime(baseTimeStr, offsetMinutes) {
    const parsed = parseTimeString(baseTimeStr);
    if (!parsed) return null;
    let [hrs, mins] = parsed.split(':').map(Number);
    let total = hrs * 60 + mins - offsetMinutes;
    if (total < 0) total += 1440;
    return `${String(Math.floor(total/60)).padStart(2,'0')}:${String(total%60).padStart(2,'0')}`;
  }

  function runBackgroundAlarmDaemon() {
    setInterval(() => {
      const now  = new Date();
      const hrs  = String(now.getHours()).padStart(2,'0');
      const mins = String(now.getMinutes()).padStart(2,'0');
      const secs = String(now.getSeconds()).padStart(2,'0');
      document.getElementById('liveClockDisplay').textContent = `${hrs}:${mins}:${secs}`;

      const todayStr = getToday();
      const curTime  = `${hrs}:${mins}`;
      const fullSchedule = buildSchedule();
      const todayDay = fullSchedule.find(d => d.date === todayStr);
      if (!todayDay || state[`skip_day_${todayDay.key}`]) return;

      getComputedDayTasks(todayDay, fullSchedule).forEach(task => {
        if (task.isCounter || state[task.id]) return;
        let targetTime;
        let msg;
        if (task.brand === 'meet') {
          targetTime = calculateMeetingAlarmTime(task.time, currentMeetingOffset);
          msg = `MEETING IN ${currentMeetingOffset}m: ${task.text}`;
        } else {
          targetTime = parseTimeString(task.time);
          msg = `[${task.time}] ${task.text}`;
        }
        if (!targetTime || targetTime !== curTime || alertedTasks[task.id]) return;
        alertedTasks[task.id] = true;
        playAlertChime();
        if (Notification.permission === 'granted') new Notification('ENIGMA — Alert', { body: msg });
      });
    }, 1000);
  }

  // ── METRICS ───────────────────────────────────────────────────────────────
  function getDayMetrics(day, fullSchedule) {
    if (state[`skip_day_${day.key}`]) return { total:0, done:0, percentage:0, isSkipped:true };
    const tasks = getComputedDayTasks(day, fullSchedule);
    if (!tasks.length) return { total:0, done:0, percentage:0, isSkipped:false };
    let done = 0;
    tasks.forEach(t => {
      if (t.isCounter) { if ((state[t.id] || 0) > 0) done++; }
      else             { if (state[t.id]) done++; }
    });
    return { total:tasks.length, done, percentage: Math.round((done/tasks.length)*100), isSkipped:false };
  }

  function dayCompletion(day, fullSchedule) {
    const m = getDayMetrics(day, fullSchedule);
    if (m.isSkipped)   return 'skipped';
    if (m.total === 0) return 'empty';
    return m.done === 0 ? 'empty' : (m.done === m.total ? 'done' : 'partial');
  }

  function calculateGlobalVelocity() {
    const fs = buildSchedule();
    let total = 0, done = 0;
    fs.forEach(day => {
      if (state[`skip_day_${day.key}`]) return;
      getComputedDayTasks(day, fs).forEach(t => {
        total++;
        if (t.isCounter) { if ((state[t.id] || 0) > 0) done++; }
        else             { if (state[t.id]) done++; }
      });
    });
    document.getElementById('velocityFill').style.width = `${total > 0 ? (done/total)*100 : 0}%`;
  }

  // ── RENDER FUNCTIONS ──────────────────────────────────────────────────────
  function renderStreak() {
    const el = document.getElementById('streakDots'); el.innerHTML = '';
    const today = getToday();
    const fs = buildSchedule();
    fs.forEach(day => {
      const dot    = document.createElement('div'); dot.className = 's-dot';
      const circle = document.createElement('div'); circle.className = 's-circle';
      const label  = document.createElement('div'); label.className = 's-day-label'; label.textContent = day.label;
      if (day.date === today) {
        circle.classList.add('is-today');
      } else {
        const s = dayCompletion(day, fs);
        if (s === 'done')    circle.classList.add('done');
        if (s === 'partial') circle.classList.add('partial');
        if (s === 'skipped') circle.classList.add('skipped');
      }
      dot.appendChild(circle); dot.appendChild(label); el.appendChild(dot);
    });
  }

  function updateTodayCount() {
    const today = getToday();
    const fs    = buildSchedule();
    const dayData = fs.find(d => d.date === today);
    const el = document.getElementById('todayCount');
    if (!dayData) { el.textContent = '—'; return; }
    if (state[`skip_day_${dayData.key}`]) { el.textContent = 'SKIP'; return; }
    const m = getDayMetrics(dayData, fs);
    el.textContent = `${m.done}/${m.total}`;

  function executeSummaryRenderAnalytics() {
    const anchor = document.getElementById('brandMetricsAnchor'); anchor.innerHTML = '';
    const fs = buildSchedule();
    let reuploadSum = 0;
    const diag = { cp:{total:0,done:0}, tratun:{total:0,done:0}, studio:{total:0,done:0}, pray:{total:0,done:0}, meet:{total:0,done:0} };
    fs.forEach(day => {
      day.tasks.forEach(t => {
        if (t.isCounter) { reuploadSum += (state[t.id] || 0); }
        else if (diag[t.brand]) {
          diag[t.brand].total++;
          if (state[t.id]) diag[t.brand].done++;
        }
      });
    });
    Object.keys(diag).forEach(bk => {
      const m = diag[bk];
      const pct = m.total > 0 ? Math.round((m.done/m.total)*100) : 0;
      const row = document.createElement('div'); row.className = 'brand-row-metric';
      row.innerHTML = `
        <div class="brand-row-meta">
          <div class="brand-label-text">
            <div style="width:7px;height:7px;border-radius:50%;background:var(--${bk});box-shadow:0 0 6px var(--${bk})"></div>
            ${BRAND_LABELS[bk]}
          </div>
          <div style="color:var(--muted)">${m.done}/${m.total} (${pct}%)</div>
        </div>
        <div class="brand-bar-track">
          <div class="brand-bar-fill" style="width:${pct}%;background:var(--${bk})"></div>
        </div>`;
      anchor.appendChild(row);
    });
    document.getElementById('reuploadRunningCount').textContent = reuploadSum;
  }

  // FIX 1 + FIX 4: Corrected FullSchedule → const fullSchedule, and replaced dead CSS with body class toggle
  function renderGrid() {

    if (summaryLayoutVisible) {
      grid.style.display = 'none';
      summaryPane.style.display = 'flex';

    summaryPane.style.display = 'none';

        executeRenderCycles();

              });
              btns.appendChild(btn);
            });
            widget.appendChild(cHead); widget.appendChild(cTime); widget.appendChild(btns); tasksEl.appendChild(widget);

          } else {
            const item = document.createElement('div');
            item.className = `task-item brand-${task.brand}${state[task.id] ? ' done' : ''}${task.isCarriedForward ? ' carry-forward-derived' : ''}`;

            const row = document.createElement('div'); row.className = 'task-row';

            notesInput.placeholder = 'Add contextual logging notes...';
            notesInput.value = taskNotes[task.id] || '';
            notesInput.addEventListener('click', (e) => e.stopPropagation());
            notesInput.addEventListener('input', (e) => { taskNotes[task.id] = e.target.value; saveTaskNotes(); });
            drawer.appendChild(notesInput);
            content.appendChild(drawer);

            row.appendChild(pip); row.appendChild(check); row.appendChild(content); item.appendChild(row);

            item.addEventListener('click', (e) => {
              if (e.target === notesInput) return;
              if (e.target.closest('.task-check') || state[task.id]) {
                state[task.id] = !state[task.id];
                syncToCloud(task.id, state[task.id]); executeRenderCycles();
              } else {
                document.querySelectorAll('.task-notes-drawer').forEach(d => { if (d !== drawer) d.classList.remove('open'); });
                drawer.classList.toggle('open');
              }
            });
            tasksEl.appendChild(item);
          }
        });
      }
      col.appendChild(tasksEl); grid.appendChild(col);
    });

  document.getElementById('meetingOffsetConfig').addEventListener('change', (e) => {
    currentMeetingOffset = parseInt(e.target.value, 10);
    localStorage.setItem(MEETING_OFFSET_KEY, currentMeetingOffset.toString());
    alertedTasks = {};
  });

  document.getElementById('summaryViewToggleBtn').addEventListener('click', (e) => {
    summaryLayoutVisible = !summaryLayoutVisible;
    e.target.classList.toggle('active-view-btn', summaryLayoutVisible);
    executeRenderCycles();
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    if (confirm('Reset weekly tracking operational vectors?')) {
      state = {}; customTasks = []; taskNotes = {};
      saveCustomTasks(customTasks); saveTaskNotes();
      clearCloudState(); executeRenderCycles();
    }
  });

  const modal = document.getElementById('taskModal');
  document.getElementById('addTaskBtn').addEventListener('click', () => {
    const daySelect = document.getElementById('modDay'); daySelect.innerHTML = '';
    baseWeekConfig.forEach(d => { daySelect.innerHTML += `<option value="${d.key}">${d.label}</option>`; });
    modal.style.display = 'flex';
  });
  document.getElementById('modCancel').addEventListener('click', () => modal.style.display = 'none');
  document.getElementById('modSave').addEventListener('click', () => {
    const txt = document.getElementById('modText').value.trim(); if (!txt) return alert('Task text missing.');
    const taskType = document.getElementById('modType').value;
    customTasks.push({
      id:       'custom_' + Date.now(),
      dayKey:   document.getElementById('modDay').value,
      brand:    document.getElementById('modBrand').value,
      text:     txt,
      time:     document.getElementById('modTime').value.trim() || 'Anytime',
      oneTime:  false, // FIX 5: custom tasks are not one-time by default
      taskType: taskType
    });
    saveCustomTasks(customTasks); modal.style.display = 'none';
    document.getElementById('modText').value = ''; document.getElementById('modTime').value = '';
    executeRenderCycles();
  });

  // ── BOOT ──────────────────────────────────────────────────────────────────
  function bootTrackerEngine() {
    const modeParam = new URLSearchParams(window.location.search).get('view');
    if (modeParam === 'day') {
      currentLayoutView = 'day';
      document.getElementById('viewLayoutSwitch').value = 'day';
    }
    runBackgroundAlarmDaemon();
    fetchCloudState();
  }

  bootTrackerEngine();
});
</script>
</body>
</html>
