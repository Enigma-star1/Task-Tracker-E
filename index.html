<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ENIGMA — Premium Output Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09060b;
      --surface: rgba(19, 13, 24, 0.75);
      --border: rgba(188, 163, 193, 0.15);
      --border-light: rgba(188, 163, 193, 0.3);
      --text: #F3EFF5;
      --muted: #A393A8;
      --cp: #FF6B35;
      --tratun: #2563EB;
      --studio: #A855F7;
      --pray: #10B981;
      --meet: #64748B;
      --accent-purple: #6d3576;
      --accent-gold: #9c6823;
      --accent-lavender: #bca3c1;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: radial-gradient(at 0% 0%, rgba(109, 53, 118, 0.4) 0px, transparent 50%),
                  radial-gradient(at 100% 100%, rgba(156, 104, 35, 0.25) 0px, transparent 50%),
                  radial-gradient(at 50% 100%, rgba(188, 163, 193, 0.15) 0px, transparent 70%),
                  var(--bg);
      background-attachment: fixed;
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 32px 32px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      backdrop-filter: blur(10px);
    }

    .brand-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 46px;
      font-weight: 800;
      letter-spacing: 8px;
      color: #fff;
      line-height: 1;
      text-shadow: 0 4px 12px rgba(0,0,0,0.5);
    }

    .brand-sub {
      font-size: 11px;
      color: var(--accent-lavender);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 8px;
      font-weight: 500;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .controls-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .select-dropdown {
      background: rgba(19, 13, 24, 0.9);
      border: 1px solid var(--border-light);
      padding: 8px 14px;
      border-radius: 6px;
      color: #fff;
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
      outline: none;
      transition: all 0.2s;
    }

    .action-btn {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-light);
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .action-btn:hover, .action-btn.active-view-btn {
      background: var(--accent-purple);
      border-color: var(--accent-lavender);
    }

    .meta-time-block {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .clock-display {
      text-align: right;
    }

    .clock-time {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 44px;
      font-weight: 800;
      line-height: 1;
      color: var(--text);
      letter-spacing: 1px;
    }

    .clock-label {
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .today-block {
      text-align: right;
    }

    .today-count {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 44px;
      font-weight: 800;
      line-height: 1;
      color: var(--accent-gold);
    }

    .today-count-label {
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .metrics-bar {
      padding: 14px 32px;
      border-bottom: 1px solid var(--border);
      background: rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .streak-container {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .streak-label {
      font-size: 9px;
      color: var(--accent-lavender);
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 500;
    }

    .streak-dots {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .s-dot {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .s-circle {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--border-light);
      transition: all 0.3s ease;
    }

    .s-circle.done    { background: var(--pray); box-shadow: 0 0 8px var(--pray); }
    .s-circle.partial { background: var(--cp); box-shadow: 0 0 8px var(--cp); }
    .s-circle.skipped { background: var(--meet); box-shadow: none; opacity: 0.4; }
    .s-circle.is-today {
      background: transparent;
      border: 2px solid var(--accent-gold);
      box-shadow: 0 0 6px var(--accent-gold);
    }

    .s-day-label {
      font-size: 9px;
      color: var(--muted);
      font-weight: 600;
    }

    .progress-analytics {
      flex: 1;
      max-width: 400px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .progress-bg {
      flex: 1;
      height: 6px;
      background: rgba(255,255,255,0.05);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-purple), var(--accent-gold));
      transition: width 0.4s ease;
    }

    .day-tabs-row {
      display: none;
      padding: 10px 32px;
      background: rgba(0,0,0,0.1);
      border-bottom: 1px solid var(--border);
      gap: 8px;
    }

    .tab-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 11px;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .tab-btn.active {
      color: #fff;
      background: rgba(109, 53, 118, 0.3);
      border-color: var(--accent-purple);
      font-weight: 600;
    }

    .grid-wrapper {
      flex: 1;
      overflow-x: auto;
      display: flex;
      flex-direction: column;
    }

    .week-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(180px, 1fr));
      min-width: 1260px;
      height: 100%;
      flex: 1;
    }

    .week-grid.single-mode {
      grid-template-columns: 1fr;
      min-width: 0;
      max-width: 600px;
      margin: 40px auto;
      width: 100%;
      padding: 0 20px;
    }

    .day-col {
      border-right: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .day-col.skipped-state {
      opacity: 0.4;
    }

    .day-col:last-child { border-right: none; }
    .day-col.is-today { background: rgba(109, 53, 118, 0.12); }
    
    .day-col.is-today::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--accent-purple), var(--accent-gold));
    }

    .week-grid.single-mode .day-col {
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .day-head {
      padding: 20px 16px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .day-head-meta {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
    }

    .day-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--muted);
      line-height: 1.1;
    }

    .day-date {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 1px;
      color: var(--accent-lavender);
      text-transform: uppercase;
    }

    .day-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .day-completion-badge {
      font-size: 11px;
      font-weight: 600;
      color: var(--accent-gold);
    }

    .skip-toggle-link {
      font-size: 9px;
      color: var(--muted);
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: color 0.15s;
    }

    .skip-toggle-link:hover {
      color: var(--cp);
    }

    .day-col.skipped-state .skip-toggle-link {
      color: var(--pray);
    }

    .day-col.is-today .day-name { color: #fff; }
    .day-col.is-today .day-date { color: var(--accent-gold); }

    .day-tasks {
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .skipped-msg {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--muted);
      text-transform: uppercase;
    }

    .task-item {
      padding: 12px 14px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
    }

    .task-item:hover { 
      border-color: var(--border-light); 
      background: rgba(255, 255, 255, 0.04);
    }
    
    .task-item.done { opacity: 0.25; }

    .task-item.carry-forward-derived {
      border-style: dashed;
      border-color: rgba(255, 107, 53, 0.4);
      background: rgba(255, 107, 53, 0.02);
    }

    .task-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .brand-pip {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 5px;
    }

    .brand-cp    .brand-pip { background: var(--cp); box-shadow: 0 0 6px var(--cp); }
    .brand-tratun .brand-pip { background: var(--tratun); box-shadow: 0 0 6px var(--tratun); }
    .brand-studio .brand-pip { background: var(--studio); box-shadow: 0 0 6px var(--studio); }
    .brand-pray   .brand-pip { background: var(--pray); box-shadow: 0 0 6px var(--pray); }
    .brand-meet   .brand-pip { background: var(--meet); box-shadow: 0 0 6px var(--meet); }

    .task-check {
      width: 15px;
      height: 15px;
      border: 1.5px solid var(--muted);
      border-radius: 4px;
      flex-shrink: 0;
      margin-top: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .task-item.done .task-check {
      background: var(--accent-purple);
      border-color: var(--accent-lavender);
    }

    .chk-svg { opacity: 0; width: 9px; height: 7px; }
    .task-item.done .chk-svg { opacity: 1; }

    .task-content { flex: 1; }

    .task-text {
      font-size: 12px;
      line-height: 1.5;
      color: #fff;
      font-weight: 400;
    }

    .task-item.done .task-text {
      text-decoration: line-through;
      color: var(--muted);
    }

    .task-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 4px;
    }

    .task-time {
      font-size: 10px;
      color: var(--accent-lavender);
    }

    .task-badges {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .one-time-tag {
      display: inline-block;
      font-size: 8px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--pray);
      background: rgba(16, 185, 129, 0.12);
      padding: 2px 6px;
      border-radius: 3px;
    }

    .carry-tag {
      display: inline-block;
      font-size: 8px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--cp);
      background: rgba(255, 107, 53, 0.12);
      padding: 2px 6px;
      border-radius: 3px;
    }

    .task-notes-drawer {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.22s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .task-notes-drawer.open {
      max-height: 100px;
    }

    .task-notes-field {
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--accent-lavender);
      font-family: inherit;
      font-size: 11px;
      padding: 6px 8px;
      margin-top: 8px;
      outline: none;
      resize: none;
    }

    .task-notes-field:focus {
      border-color: var(--accent-purple);
    }

    .counter-widget {
      border: 1px solid var(--border-light);
      border-radius: 6px;
      padding: 10px 12px;
      background: rgba(109, 53, 118, 0.05);
    }

    .counter-head {
      font-size: 10px;
      color: var(--text);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .counter-head span { color: var(--accent-gold); font-weight: 600; }

    .counter-time {
      font-size: 9px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .counter-btns {
      display: flex;
      gap: 6px;
    }

    .c-btn {
      flex: 1;
      height: 28px;
      border: 1.5px solid var(--border-light);
      background: transparent;
      color: var(--muted);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 16px;
      font-weight: 700;
      border-radius: 4px;
      cursor: pointer;
    }

    .c-btn.active { background: var(--accent-purple); border-color: var(--accent-lavender); color: #fff; }

    .summary-view-pane {
      display: none;
      max-width: 800px;
      width: 100%;
      margin: 40px auto;
      padding: 0 20px;
      flex-direction: column;
      gap: 24px;
    }

    .macro-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
    }

    .macro-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #fff;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    .brand-row-metric {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 20px;
    }

    .brand-row-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      text-transform: uppercase;
    }

    .brand-label-text {
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-bar-track {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 4px;
      overflow: hidden;
    }

    .brand-bar-fill {
      height: 100%;
      width: 0%;
      transition: width 0.5s ease;
      border-radius: 4px;
    }

    .reupload-running-block {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 107, 53, 0.05);
      border: 1px dashed var(--cp);
      padding: 16px;
      border-radius: 6px;
    }

    .reupload-running-title {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text);
    }

    .reupload-running-count {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 36px;
      font-weight: 800;
      color: var(--cp);
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(7, 7, 15, 0.85);
      backdrop-filter: blur(8px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: #14101A;
      border: 1px solid var(--border-light);
      padding: 28px;
      border-radius: 8px;
      width: 340px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal-content h3 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 22px;
    }

    .modal-content input, .modal-content select {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      padding: 10px;
      color: #fff;
      font-family: inherit;
    }

    /* Fixed visibility overlay mechanics line 438 */
    .modal-content select option {
      background: #14101A !important;
      color: #fff !important;
    }

    .footer-legend {
      padding: 16px 32px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      background: rgba(0,0,0,0.2);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 10px;
      color: var(--accent-lavender);
      text-transform: uppercase;
    }

    .l-dot { width: 8px; height: 8px; border-radius: 50%; }

    body:has(#viewLayoutSwitch[value="day"]) .header { padding: 16px 20px; }
    body:has(#viewLayoutSwitch[value="day"]) .brand-title { font-size: 32px; }
    body:has(#viewLayoutSwitch[value="day"]) .metrics-bar { padding: 10px 20px; }
    body:has(#viewLayoutSwitch[value="day"]) .week-grid.single-mode { margin: 15px auto; }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <div class="brand-title">OUTPUT TRACKER</div>
      <div class="brand-sub" id="weekRangeDisplay">ENIGMA</div>
    </div>
    <div class="header-right">
      <div class="controls-wrapper">
        <select class="select-dropdown" id="viewLayoutSwitch">
          <option value="week">Full Week View</option>
          <option value="day">Single Day View</option>
        </select>
        <select class="select-dropdown" id="brandFilter">
          <option value="all">All Brands</option>
          <option value="cp">CareerPaddy</option>
          <option value="tratun">Tratun</option>
          <option value="studio">Enigma Studio</option>
          <option value="pray">Praying Scripture</option>
          <option value="meet">Meetings</option>
        </select>
        <select class="select-dropdown" id="meetingOffsetConfig">
          <option value="20">Meet Alert: 20m early</option>
          <option value="15">Meet Alert: 15m early</option>
          <option value="30">Meet Alert: 30m early</option>
        </select>
        <button class="action-btn" id="summaryViewToggleBtn">Summary</button>
        <button class="action-btn" id="addTaskBtn">+ Task</button>
        <button class="action-btn" id="resetBtn">Reset</button>
      </div>
      <div class="meta-time-block">
        <div class="clock-display">
          <div class="clock-time" id="liveClockDisplay">00:00:00</div>
          <div class="clock-label">Local Time</div>
        </div>
        <div class="today-block">
          <div class="today-count" id="todayCount">—</div>
          <div class="today-count-label">Today Done</div>
        </div>
      </div>
    </div>
  </div>

  <div class="metrics-bar">
    <div class="streak-container">
      <div class="streak-label">7-Day Rhythm</div>
      <div class="streak-dots" id="streakDots"></div>
    </div>
    <div class="progress-analytics">
      <div class="streak-label">Velocity</div>
      <div class="progress-bg"><div class="progress-fill" id="velocityFill"></div></div>
    </div>
  </div>

  <div class="day-tabs-row" id="dayTabsRow"></div>

  <div class="grid-wrapper">
    <div class="week-grid" id="weekGrid"></div>
    
    <div class="summary-view-pane" id="summaryViewPane">
      <div class="macro-card">
        <div class="macro-title">Brand Track Diagnostics</div>
        <div id="brandMetricsAnchor"></div>
      </div>
      <div class="reupload-running-block">
        <div class="reupload-running-title">Weekly Cumulative Reuploads</div>
        <div class="reupload-running-count" id="reuploadRunningCount">0</div>
      </div>
    </div>
  </div>

  <div class="footer-legend">
    <div class="legend-item"><div class="l-dot" style="background:var(--cp)"></div>CareerPaddy</div>
    <div class="legend-item"><div class="l-dot" style="background:var(--tratun)"></div>Tratun</div>
    <div class="legend-item"><div class="l-dot" style="background:var(--studio)"></div>Enigma Studio</div>
    <div class="legend-item"><div class="l-dot" style="background:var(--pray)"></div>Praying Scripture</div>
    <div class="legend-item"><div class="l-dot" style="background:var(--meet)"></div>Meeting</div>
  </div>

  <div class="modal" id="taskModal">
    <div class="modal-content">
      <h3>INJECT CUSTOM TASK</h3>
      <select id="modDay"></select>
      <select id="modBrand">
        <option value="cp">CareerPaddy</option>
        <option value="tratun">Tratun</option>
        <option value="studio">Enigma Studio</option>
        <option value="pray">Praying Scripture</option>
        <option value="meet">Meeting</option>
      </select>
      <select id="modType">
        <option value="production">Production Task (Carries Forward)</option>
        <option value="time-anchored">Time-Anchored (Stays Behind)</option>
      </select>
      <input type="text" id="modText" placeholder="Task description">
      <input type="text" id="modTime" placeholder="Time string parsed (e.g. 4pm, 11am)">
      <div style="display:flex; gap:10px; margin-top:10px;">
